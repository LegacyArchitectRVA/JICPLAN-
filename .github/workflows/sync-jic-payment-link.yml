name: Sync JIC Plan payment link

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace legacy JIC checkout link
        run: |
          OLD='https://buy.stripe.com/9B6fZjeyGgWO3zj0ct5Rm0o'
          NEW='https://buy.stripe.com/aFafZhavZcCIe7qbI96Zy01'
          found=0
          while IFS= read -r -d '' file; do
            if grep -Fq "$OLD" "$file"; then
              sed -i "s|$OLD|$NEW|g" "$file"
              echo "Updated $file"
              found=1
            fi
          done < <(find . -type f -name '*.html' -print0 -not -path './.git/*')
          if [ "$found" -eq 0 ]; then
            echo 'No legacy JIC checkout URL found; nothing to change.'
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No JIC checkout changes needed."
          else
            git commit -m "fix: wire JIC Plan checkout to active Stripe link"
            git push
          fi
